[project]
name = "mojo-rtree"
version = "0.1.0"
description = "An STR-packed R-tree implemented in Mojo with an rtree-compatible Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "rtree", "spatial-index", "gis"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "rtree"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
